name: Chimera CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build environment
        run: make setup
      - name: Run Linting
        run: make lint

      - name: Run Security Check
        run: make security

      - name: Run tests in Docker
        run: make test

      - name: Spec alignment check
        run: make spec-check
